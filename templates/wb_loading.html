<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Формируем отчёт WB…</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#0e0f14; --surface:#161820; --border:#2a2d3e; --accent:#7c6af7; --accent2:#4fd1c5; --text:#e8eaf6; --muted:#7b7f9e; --tr:background .25s,color .25s,border-color .25s }
:root.light { --bg:#f3f5f9; --surface:#ffffff; --border:#dde1ea; --accent:#6450e6; --accent2:#2eb8ac; --text:#1a1d2e; --muted:#5a6072 }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;transition:var(--tr)}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(124,106,247,.08) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(79,209,197,.06) 0%,transparent 50%);pointer-events:none}
:root.light body::before{opacity:.35}
.theme-btn{position:fixed;top:18px;right:18px;z-index:100;background:var(--surface);border:1px solid var(--border);color:var(--muted);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:var(--tr),transform .15s;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.wrap{position:relative;max-width:460px;width:100%}
.spinner{width:64px;height:64px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);border-right-color:var(--accent2);margin:0 auto 24px;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.label{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;color:#a89df8;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
h1{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:900;margin-bottom:8px;color:var(--text)}
h1 span{color:var(--accent)}
.sub{font-size:13px;color:var(--muted);margin-bottom:32px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:10px;font-size:14px;text-align:left;transition:all .25s;min-height:54px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.bar{height:4px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:18px}
.bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:fill 60s linear forwards;border-radius:3px}
@keyframes fill{0%{width:0}100%{width:95%}}
.hint{margin-top:14px;font-size:11px;color:var(--muted)}
.err{background:rgba(252,92,101,.08);border:1px solid rgba(252,92,101,.3);color:#fc5c65;padding:14px 18px;border-radius:10px;font-size:13px;text-align:left;margin-top:16px}
.err a{color:#fc5c65;text-decoration:underline}
</style></head>
<body>
<button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Сменить тему">🌙</button>
<script>
function applyTheme(t){
  document.documentElement.classList.toggle('light', t==='light');
  var b=document.getElementById('theme-btn'); if(b) b.textContent=t==='light'?'🌙':'☀️';
}
function toggleTheme(){
  var n=document.documentElement.classList.contains('light')?'dark':'light';
  try{localStorage.setItem('theme',n);}catch(e){} applyTheme(n);
}
try{applyTheme(localStorage.getItem('theme')||'dark');}catch(e){applyTheme('dark');}
</script>
<div class="wrap">
  <div class="spinner"></div>
  <div class="label">🛍 Wildberries · {{ cabinet }}</div>
  <h1>Формируем <span>отчёт</span></h1>
  <div class="sub">Период: {{ period }}</div>
  <div class="step" id="step"><span class="dot"></span><span id="step-text">Подключаемся к WB API…</span></div>
  <div class="bar"><div class="bar-fill"></div></div>
  <div class="hint">Обычно занимает 30–60 секунд. Не закрывайте вкладку и не обновляйте — данные подгружаются по rate-limit.</div>
  <div id="err"></div>
</div>
<script>
(function(){
  // Циклически меняем подсказки, чтобы было видно "процесс идёт"
  var steps = [
    "Подключаемся к WB API…",
    "Запрашиваем историю расходов на рекламу…",
    "Загружаем список кампаний…",
    "Считаем статистику кампаний (показы, клики, CTR)…",
    "Загружаем воронку продаж по карточкам…",
    "Сравниваем с предыдущей неделей…",
    "Готовим выводы и рекомендации…",
    "Собираем отчёт — ещё чуть-чуть…"
  ];
  var i = 0;
  var t = document.getElementById('step-text');
  setInterval(function(){ i = (i+1) % steps.length; t.textContent = steps[i]; }, 5000);

  // Тянем готовый отчёт. По готовности — подменяем всю страницу.
  var url = "{{ report_url }}";
  fetch(url, {headers: {"Accept": "text/html"}}).then(function(r){
    if (!r.ok) {
      return r.text().then(function(text){ throw new Error(r.status + ": " + text.slice(0,300)); });
    }
    return r.text();
  }).then(function(html){
    document.open(); document.write(html); document.close();
  }).catch(function(e){
    document.getElementById('err').innerHTML =
      '<div class="err">⚠ Не удалось сформировать отчёт.<br><br>' +
      String(e).replace(/</g,'&lt;') + '<br><br>' +
      '<a href="/wb">← Вернуться на главную</a></div>';
    document.querySelector('.spinner').style.borderTopColor = '#fc5c65';
  });
})();
</script>
</body></html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Юнит-экономика</title>
<style>
:root{
  --bg:#0f1117;--bg2:#161b22;--bg3:#1c2333;--bg4:#21262d;
  --border:#30363d;--text:#e6edf3;--text2:#8b949e;--text3:#484f58;
  --blue:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;
  --comp-bg:#181e28;--comp-text:#8b949e;
}
[data-theme="light"]{
  --bg:#f6f8fa;--bg2:#fff;--bg3:#f0f2f5;--bg4:#e8ebf0;
  --border:#d0d7de;--text:#24292f;--text2:#656d76;--text3:#8c959f;
  --comp-bg:#f0f2f5;--comp-text:#656d76;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
.hdr{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;z-index:20}
.hdr-logo{font-weight:700;font-size:15px}
.hdr-sep{flex:1}
.hbtn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;white-space:nowrap;text-decoration:none}
.hbtn:hover{background:var(--bg4);color:var(--text)}
.hbtn.act{background:var(--blue);color:#fff;border-color:var(--blue)}
.theme-btn{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.toolbar-title{font-weight:600;font-size:14px;margin-right:4px}
.proj-select{padding:6px 12px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);font-size:13px;cursor:pointer;min-width:160px}
.proj-select:focus{outline:none;border-color:var(--blue)}
.btn-add{padding:6px 14px;border-radius:7px;border:none;background:var(--blue);
  color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn-add:hover{opacity:.85}
.btn-add:disabled{opacity:.4;cursor:default}
.save-indicator{font-size:12px;color:var(--text3);min-width:80px}
.save-indicator.saving{color:var(--yellow)}
.save-indicator.saved{color:var(--green)}
.tsep{width:1px;height:22px;background:var(--border)}

/* ── Table container ── */
.tbl-outer{flex:1;overflow:auto;padding:0 20px 20px}
.tbl-wrap{margin-top:16px;border:1px solid var(--border);border-radius:10px;overflow:auto}
table{border-collapse:collapse;min-width:max-content;width:100%}

/* ── Header rows ── */
thead tr.grp-row th{
  background:var(--bg4);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--text3);padding:5px 10px;border-bottom:1px solid var(--border);
  text-align:center;white-space:nowrap}
thead tr.grp-row th.grp-comp{background:#151c27;color:var(--text3)}
thead tr.col-row th{
  background:var(--bg3);font-size:11px;font-weight:600;color:var(--text2);
  padding:7px 8px;border-bottom:2px solid var(--border);white-space:nowrap;
  position:sticky;top:0;z-index:3;text-align:right}
thead tr.col-row th.left{text-align:left}
thead tr.col-row th.comp{background:var(--comp-bg);color:var(--text3)}

/* ── Body rows ── */
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:rgba(88,166,255,.04)}
tbody tr:last-child{border-bottom:none}

/* Editable cell */
td.ed{padding:3px 4px;vertical-align:middle}
td.ed input,td.ed select{
  width:100%;border:none;background:transparent;color:var(--text);
  font-size:12px;font-family:inherit;padding:4px 5px;border-radius:4px;
  text-align:right;min-width:70px}
td.ed input[type=text],td.ed input.art{text-align:left;min-width:100px}
td.ed select{min-width:130px;cursor:pointer}
td.ed input:focus,td.ed select:focus{
  outline:none;background:rgba(88,166,255,.1);border:1px solid var(--blue)}
td.ed input:hover,td.ed select:hover{background:var(--bg3)}

/* Computed cell */
td.comp{
  background:var(--comp-bg);color:var(--comp-text);
  padding:5px 10px;text-align:right;white-space:nowrap;font-size:12px;
  font-variant-numeric:tabular-nums}
td.comp.profit-pos{color:var(--green)}
td.comp.profit-neg{color:var(--red)}
td.comp.profit-mid{color:var(--yellow)}

/* Delete cell */
td.del-cell{width:32px;padding:3px 6px;text-align:center}
.del-btn{width:24px;height:24px;border-radius:5px;border:none;
  background:transparent;color:var(--text3);cursor:pointer;font-size:14px;line-height:1}
.del-btn:hover{background:rgba(248,81,73,.15);color:var(--red)}

/* Import modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;
  align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  width:520px;max-width:96vw;max-height:80vh;display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.5)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-weight:600;font-size:15px}
.modal-close{width:28px;height:28px;border-radius:5px;border:none;
  background:var(--bg3);color:var(--text2);cursor:pointer;font-size:16px}
.modal-close:hover{color:var(--text)}
.modal-search{padding:10px 20px;border-bottom:1px solid var(--border)}
.modal-search input{width:100%;padding:7px 10px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px}
.modal-search input:focus{outline:none;border-color:var(--blue)}
.modal-body{flex:1;overflow-y:auto;padding:8px 0}
.modal-loading{display:flex;align-items:center;justify-content:center;
  padding:40px;color:var(--text3);font-size:14px;gap:10px}
.import-item{display:flex;align-items:center;gap:10px;padding:7px 20px;cursor:pointer}
.import-item:hover{background:var(--bg3)}
.import-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);flex-shrink:0}
.import-item-info{flex:1;min-width:0}
.import-item-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.import-item-meta{font-size:11px;color:var(--text3);font-family:monospace}
.import-item.exists .import-item-name{color:var(--text3)}
.modal-ftr{padding:12px 20px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:10px}
.modal-sel-all{font-size:12px;color:var(--blue);cursor:pointer;border:none;
  background:none;padding:0;flex:1;text-align:left}
.btn-import{padding:7px 18px;border-radius:7px;border:none;background:var(--blue);
  color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn-import:hover{opacity:.85}
.btn-import:disabled{opacity:.4;cursor:default}

/* Margin badge */
.mbadge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600}
.mbadge.hi{background:#1f3a2a;color:var(--green)}
.mbadge.mid{background:#2e2a1a;color:var(--yellow)}
.mbadge.lo{background:#2a1a1a;color:var(--red)}
[data-theme="light"] .mbadge.hi{background:#d2f4db;color:#1a7f37}
[data-theme="light"] .mbadge.mid{background:#fff3cd;color:#9a6700}
[data-theme="light"] .mbadge.lo{background:#ffe4e4;color:#cf222e}

/* Footer / summary */
tfoot td{
  background:var(--bg4);font-weight:600;font-size:12px;padding:6px 10px;
  border-top:2px solid var(--border);white-space:nowrap;text-align:right}
tfoot td.left{text-align:left;color:var(--text2)}
tfoot td.fcomp{background:var(--comp-bg)}

/* Empty / no-project state */
.placeholder{display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:80px 24px;color:var(--text3);gap:14px;text-align:center}
.placeholder-icon{font-size:48px}
.placeholder-text{font-size:16px}
.placeholder-sub{font-size:13px;color:var(--text3)}
</style>
</head>
<body data-theme="dark">

<div class="hdr">
  <span class="hdr-logo">📊 Дашборд</span>
  <div class="hdr-sep"></div>
  <a href="/" class="hbtn">📋 Задачи</a>
  <a href="/plan-fact" class="hbtn">📊 План-Факт</a>
  <a href="/unit" class="hbtn act">💰 Юнит</a>
  {% if current_user.role == 'admin' %}
  <a href="/admin" class="hbtn">⚙️ Пользователи</a>
  {% endif %}
  <button class="hbtn theme-btn" onclick="toggleTheme()">🌙</button>
  <a href="/auth/logout" class="hbtn" style="color:var(--red)">Выйти</a>
</div>

<div class="toolbar">
  <span class="toolbar-title">💰 Юнит-экономика</span>
  <div class="tsep"></div>
  <select class="proj-select" id="projSelect" onchange="onProjectChange()">
    <option value="">— выберите кабинет —</option>
    {% for p in projects %}
    <option value="{{ p }}">{{ project_emoji[p] }} {{ p }}</option>
    {% endfor %}
  </select>
  <button class="btn-add" id="btnAdd" disabled onclick="addRow()">+ Строка</button>
  <button class="btn-add" id="btnImport" disabled onclick="openImport()"
    style="background:var(--bg3);color:var(--text2);border:1px solid var(--border)">
    📥 Загрузить из WB
  </button>
  <div class="tsep"></div>
  <span class="save-indicator" id="saveInd"></span>
</div>

<!-- Import modal -->
<div class="modal-overlay" id="importOverlay" onclick="closeImport(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hdr">
      <span class="modal-title" id="importTitle">Загрузка артикулов из WB</span>
      <button class="modal-close" onclick="closeImport()">✕</button>
    </div>
    <div class="modal-search">
      <input type="text" id="importSearch" placeholder="Поиск по артикулу или названию…"
        oninput="filterImport(this.value)">
    </div>
    <div class="modal-body" id="importBody">
      <div class="modal-loading">⏳ Загрузка данных из WB…</div>
    </div>
    <div class="modal-ftr">
      <button class="modal-sel-all" onclick="toggleAll()">Выбрать все</button>
      <button class="btn-import" id="btnDoImport" disabled onclick="doImport()">
        Добавить 0 артикулов
      </button>
    </div>
  </div>
</div>

<div class="tbl-outer">
  <div id="content"></div>
</div>

<script>
// ─── Данные ──────────────────────────────────────────────────────────────────
const PROJECTS_DATA = {{ projects | tojson }};
const WAREHOUSE_COEFS = {
  'Обухово СГТ':75,'Голицыно СГТ':75,'Радумля СГТ':95,'Шушары СГТ':95,
  'Волгоград':110,'Рязань':120,'Маркетплейс':125,'Подольск 4':125,'Атакент':125,
  'Сабурово':130,'Невинномысск':130,'Краснодар':130,'Владимир':140,'Тула':145,
  'Астана Карагандинское шоссе':145,'Екатеринбург - Перспективный 12':150,
  'Котовск':150,'Электросталь':170,'Обухово':170,'Щербинка':190,
  'Белая дача':195,'Подольск':200,'Коледино':205,'Казань':210,
  'Екатеринбург - Испытателей 14г':220,'Хабаровск':220,'Чехов 2':260,
  'Санкт-Петербург Уткина Заводь':270,'Белые Столбы':280,'Новосибирск':445
};
const WAREHOUSES = Object.keys(WAREHOUSE_COEFS);

let rows = [];       // [{id, _key, _dirty, project, ...fields}]
let currentProject = '';
let saveTimers = {};
let keySeq = 0;
const newKey = () => 'k' + (++keySeq);
let importArticles = [];   // [{wb_article, seller_article, name, brand}]

// ─── Формулы ─────────────────────────────────────────────────────────────────
function compute(r) {
  const cp  = +r.cost_price     || 0;
  const lw  = +r.logistics_to_wb|| 0;
  const pkg = +r.packaging      || 0;
  const ovh = +r.overhead       || 0;
  const def = +r.defect_pct     || 0;
  const wp  = +r.wb_price       || 0;
  const com = +r.commission_pct || 36;
  const red = +r.redemption_pct || 100;
  const irp = +r.irp            || 1.0;
  const dp  = +r.drr_pct        || 0;
  const de  = +r.drr_external_rub || 0;
  const qty = +r.quantity       || 0;

  const totalCost = cp + lw + pkg + ovh;

  const w = +r.width_cm, l = +r.length_cm, h = +r.height_cm;
  const liters = (w && l && h) ? w * l * h / 1000 : (+r.liters || 0);
  const wCoef  = WAREHOUSE_COEFS[r.warehouse] || 0;

  const storageDay = (liters && wCoef) ? 0.08 * liters * wCoef / 100 : (+r.storage_per_day || 0);
  const storage30  = storageDay * 30;

  let logKtr;
  if (r.logistics_ktr !== null && r.logistics_ktr !== undefined && r.logistics_ktr !== '') {
    logKtr = +r.logistics_ktr;
  } else if (liters && wCoef && red > 0) {
    logKtr = (223.2 + 2.1 * liters) * wCoef / 100 * irp / (red / 100);
  } else {
    logKtr = 0;
  }

  const commission  = wp * com / 100;
  const wbClub      = wp * 0.95;
  const usn         = wp * 0.07;
  const drrRub      = wp * dp / 100 + de;
  const brakCost    = totalCost * def / 100;
  const revenue     = wp - commission - logKtr - storage30 - usn - drrRub;
  const profit      = revenue - totalCost - brakCost;
  const margin      = wp > 0 ? profit / wp * 100 : 0;
  const roi         = totalCost > 0 ? profit / totalCost * 100 : 0;
  const batchProfit = profit * qty;
  const batchMargin = (qty > 0 && wp > 0) ? batchProfit / (wp * qty) * 100 : 0;
  const invested    = totalCost * qty;

  return {totalCost, liters, wCoef, storageDay, storage30,
          logKtr, commission, wbClub, usn, drrRub, brakCost,
          revenue, profit, margin, roi, batchProfit, batchMargin, invested};
}

// ─── Форматирование ──────────────────────────────────────────────────────────
const fmt2 = v => v != null && !isNaN(v) ? Math.round(v).toLocaleString('ru-RU') : '—';
const fmtR = v => v != null && !isNaN(v) ? (v < 0 ? '−' : '') + '₽ ' + Math.abs(Math.round(v)).toLocaleString('ru-RU') : '—';
const fmtP = v => v != null && !isNaN(v) ? v.toFixed(1) + '%' : '—';

function mClass(m) {
  if (isNaN(m)) return '';
  return m >= 20 ? 'hi' : m >= 10 ? 'mid' : 'lo';
}
function profitCls(v) {
  return v > 0 ? 'profit-pos' : v < 0 ? 'profit-neg' : '';
}

// ─── Загрузка ─────────────────────────────────────────────────────────────────
async function onProjectChange() {
  currentProject = document.getElementById('projSelect').value;
  const active = !!currentProject;
  document.getElementById('btnAdd').disabled    = !active;
  document.getElementById('btnImport').disabled = !active;
  if (!currentProject) { rows = []; renderContent(); return; }
  const resp = await fetch('/api/unit-rows?project=' + encodeURIComponent(currentProject));
  rows = await resp.json();
  rows.forEach(r => { r._key = newKey(); r._dirty = false; });
  renderContent();
}

// ─── Автосохранение ──────────────────────────────────────────────────────────
function schedSave(key) {
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(() => doSave(key), 600);
  showInd('saving');
}

async function doSave(key) {
  const r = rows.find(x => x._key === key);
  if (!r || !r._dirty) return;
  const body = {...r, project: currentProject};
  delete body._key; delete body._dirty;
  const url  = r.id ? `/api/unit-rows/${r.id}` : '/api/unit-rows';
  const meth = r.id ? 'PUT' : 'POST';
  const res  = await fetch(url, {method: meth, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const json = await res.json();
  if (json.id) r.id = json.id;
  r._dirty = false;
  // update delete button
  const tr = document.querySelector(`tr[data-key="${key}"]`);
  if (tr) tr.querySelector('.del-btn').dataset.id = r.id || '';
  checkAllSaved();
}

function showInd(state) {
  const el = document.getElementById('saveInd');
  el.className = 'save-indicator ' + state;
  el.textContent = state === 'saving' ? '⏳ Сохранение…' : state === 'saved' ? '✓ Сохранено' : '';
  if (state === 'saved') setTimeout(() => { if (el.textContent === '✓ Сохранено') el.textContent = ''; }, 2000);
}

function checkAllSaved() {
  if (!rows.some(r => r._dirty)) showInd('saved');
}

// ─── Изменение ячейки ────────────────────────────────────────────────────────
function onInput(key, field, val) {
  const r = rows.find(x => x._key === key);
  if (!r) return;
  const numFields = ['cost_price','logistics_to_wb','packaging','overhead','defect_pct',
    'width_cm','length_cm','height_cm','liters','redemption_pct','irp','logistics_ktr',
    'commission_pct','wb_price','drr_pct','drr_external_rub','quantity'];
  r[field] = numFields.includes(field) ? (val === '' ? (field === 'logistics_ktr' || field === 'liters' ? null : 0) : +val) : val;
  r._dirty = true;
  updateComputedCells(key);
  schedSave(key);
}

function updateComputedCells(key) {
  const r = rows.find(x => x._key === key);
  if (!r) return;
  const c = compute(r);
  const tr = document.querySelector(`tr[data-key="${key}"]`);
  if (!tr) return;
  const set = (cls, val, extra) => {
    const el = tr.querySelector('.' + cls);
    if (!el) return;
    el.textContent = val;
    el.className = el.className.replace(/profit-\w+/g, '').replace(/mbadge \w+/g, 'mbadge').trim();
    if (extra) el.classList.add(...extra.split(' '));
  };
  set('cv-totalcost',  fmtR(c.totalCost));
  set('cv-logtgtr',    r.logistics_ktr !== null && r.logistics_ktr !== undefined && r.logistics_ktr !== ''
                         ? fmtR(+r.logistics_ktr) : fmtR(c.logKtr));
  set('cv-stor30',     fmtR(c.storage30));
  set('cv-commission', fmtR(c.commission));
  const pm = tr.querySelector('.cv-profit');
  if (pm) { pm.textContent = fmtR(c.profit); pm.className = 'comp cv-profit ' + profitCls(c.profit); }
  const mm = tr.querySelector('.cv-margin');
  if (mm) { mm.innerHTML = `<span class="mbadge ${mClass(c.margin)}">${fmtP(c.margin)}</span>`; }
  const rm = tr.querySelector('.cv-roi');
  if (rm) { rm.textContent = fmtP(c.roi); rm.className = 'comp cv-roi ' + profitCls(c.roi); }
  const bm = tr.querySelector('.cv-bmargin');
  if (bm) { bm.innerHTML = `<span class="mbadge ${mClass(c.batchMargin)}">${fmtP(c.batchMargin)}</span>`; }
  updateFooter();
}

// ─── Добавить строку ─────────────────────────────────────────────────────────
function makeEmptyRow(overrides = {}) {
  return {
    id: null, _key: newKey(), _dirty: true, project: currentProject,
    brand: currentProject, wb_article: '', seller_article: '',
    cost_price: 0, logistics_to_wb: 0, packaging: 0, overhead: 0, defect_pct: 0,
    width_cm: null, length_cm: null, height_cm: null, liters: null,
    redemption_pct: 100, warehouse: '', irp: 1.0, logistics_ktr: null,
    reception_coef: 'x0', storage_per_day: 0,
    commission_pct: 36, wb_price: 0, drr_pct: 0, drr_external_rub: 0, quantity: 0,
    ...overrides
  };
}

function addRow(overrides = {}) {
  if (!currentProject) return;
  const r = makeEmptyRow(overrides);
  rows.push(r);

  // Если таблица ещё не отрисована (пустой кабинет) — рендерим всё заново
  let tbody = document.getElementById('unit-tbody');
  if (!tbody) {
    renderContent();
  } else {
    const tr = document.createElement('tr');
    tr.dataset.key = r._key;
    tr.innerHTML = rowHTML(r);
    tbody.appendChild(tr);
    updateFooter();
  }

  // Фокус на первую ячейку новой строки
  setTimeout(() => {
    const tr = document.querySelector(`tr[data-key="${r._key}"]`);
    if (tr) tr.querySelector('.inp-seller')?.focus();
  }, 0);

  schedSave(r._key);
  return r._key;
}

// ─── Удалить строку ──────────────────────────────────────────────────────────
async function deleteRow(key, id) {
  if (!confirm('Удалить эту строку?')) return;
  if (id) await fetch(`/api/unit-rows/${id}`, {method:'DELETE'});
  rows = rows.filter(r => r._key !== key);
  const tr = document.querySelector(`tr[data-key="${key}"]`);
  if (tr) tr.remove();
  updateFooter();
}

// ─── Рендер таблицы ──────────────────────────────────────────────────────────
function warehouseOptions(selected) {
  return WAREHOUSES.map(w =>
    `<option value="${w}" ${w===selected?'selected':''}>${w}</option>`
  ).join('');
}

function rowHTML(r) {
  const c   = compute(r);
  const key = r._key;
  const n   = (v, field, cls='', ph='0', min='') =>
    `<input type="number" class="${cls}" value="${v??''}" placeholder="${ph}"
      ${min?'min="'+min+'"':''} step="any"
      oninput="onInput('${key}','${field}',this.value)">`;
  const s   = (v, field, cls='') =>
    `<input type="text" class="${cls} art" value="${esc(v??'')}"
      oninput="onInput('${key}','${field}',this.value)">`;

  const lktr = r.logistics_ktr !== null && r.logistics_ktr !== undefined && r.logistics_ktr !== ''
    ? +r.logistics_ktr : c.logKtr;

  return `
  <td class="del-cell">
    <button class="del-btn" data-id="${r.id||''}" onclick="deleteRow('${key}',${r.id||'null'})">✕</button>
  </td>
  <td class="ed">${s(r.seller_article,'seller_article','inp-seller')}</td>
  <td class="ed">${n(r.wb_article,'wb_article','','артикул')}</td>
  <td class="ed">${n(r.cost_price,'cost_price')}</td>
  <td class="ed">${n(r.packaging,'packaging')}</td>
  <td class="ed">${n(r.logistics_to_wb,'logistics_to_wb')}</td>
  <td class="ed">${n(r.overhead,'overhead')}</td>
  <td class="ed">${n(r.defect_pct,'defect_pct','','0','0')}</td>
  <td class="comp cv-totalcost">${fmtR(c.totalCost)}</td>
  <td class="ed">${n(r.liters||'','liters','','авто')}</td>
  <td class="ed">${n(r.redemption_pct,'redemption_pct','','100','0')}</td>
  <td class="ed" style="padding:3px 4px">
    <select onchange="onInput('${key}','warehouse',this.value)">
      <option value="">—</option>${warehouseOptions(r.warehouse||'')}
    </select>
  </td>
  <td class="ed">${n(r.irp||1,'irp','','1.0')}</td>
  <td class="ed">${n(r.logistics_ktr??'','logistics_ktr','','авто')}</td>
  <td class="comp cv-stor30">${fmtR(c.storage30)}</td>
  <td class="ed">${n(r.commission_pct,'commission_pct','','36')}</td>
  <td class="ed">${n(r.wb_price,'wb_price')}</td>
  <td class="ed">${n(r.drr_pct,'drr_pct','','0')}</td>
  <td class="ed">${n(r.drr_external_rub,'drr_external_rub','','0')}</td>
  <td class="ed">${n(r.quantity,'quantity','','0','0')}</td>
  <td class="comp cv-commission">${fmtR(c.commission)}</td>
  <td class="comp cv-profit ${profitCls(c.profit)}">${fmtR(c.profit)}</td>
  <td class="comp cv-margin"><span class="mbadge ${mClass(c.margin)}">${fmtP(c.margin)}</span></td>
  <td class="comp cv-roi ${profitCls(c.roi)}">${fmtP(c.roi)}</td>
  <td class="comp cv-bmargin"><span class="mbadge ${mClass(c.batchMargin)}">${fmtP(c.batchMargin)}</span></td>`;
}

function renderContent() {
  const div = document.getElementById('content');
  if (!currentProject) {
    div.innerHTML = `<div class="placeholder">
      <div class="placeholder-icon">💰</div>
      <div class="placeholder-text">Юнит-экономика</div>
      <div class="placeholder-sub">Выберите кабинет для загрузки данных</div>
    </div>`;
    return;
  }
  if (!rows.length) {
    div.innerHTML = `<div class="placeholder">
      <div class="placeholder-icon">📋</div>
      <div class="placeholder-text">Нет артикулов</div>
      <div class="placeholder-sub">Нажмите «+ Строка» чтобы добавить первый артикул</div>
    </div>`;
    return;
  }

  div.innerHTML = `<div class="tbl-wrap"><table>
  <thead>
    <tr class="grp-row">
      <th></th>
      <th colspan="2" class="left">Идентификация</th>
      <th colspan="5">Себестоимость</th>
      <th class="grp-comp">↓</th>
      <th colspan="5">Параметры ВБ</th>
      <th class="grp-comp">↓</th>
      <th colspan="4">Цена и реклама</th>
      <th colspan="1"></th>
      <th class="grp-comp" colspan="5">Результаты расчёта</th>
    </tr>
    <tr class="col-row">
      <th class="left"></th>
      <th class="left">Арт. продавца</th>
      <th class="left">WB арт.</th>
      <th>Себест.₽</th>
      <th>Упак.₽</th>
      <th>Лог.ВБ₽</th>
      <th>Накл.₽</th>
      <th>Брак%</th>
      <th class="comp" title="Итоговая себестоимость">Ит.себест.</th>
      <th>Литраж</th>
      <th>%выкупа</th>
      <th class="left">Склад</th>
      <th>ИРП</th>
      <th title="Логистика + КТР (авто если пусто)">Лог+КТР</th>
      <th class="comp" title="Хранение за 30 дней">Хран/30д</th>
      <th>Комис.%</th>
      <th>Цена ВБ₽</th>
      <th>ДРР%</th>
      <th>ДРР₽</th>
      <th>Кол-во</th>
      <th class="comp">Комис.₽</th>
      <th class="comp">Прибыль</th>
      <th class="comp">Маржа</th>
      <th class="comp">ROI</th>
      <th class="comp">Маржа пар.</th>
    </tr>
  </thead>
  <tbody id="unit-tbody">
    ${rows.map(r => `<tr data-key="${r._key}">${rowHTML(r)}</tr>`).join('')}
  </tbody>
  <tfoot id="unit-tfoot"></tfoot>
</table></div>`;
  updateFooter();
}

function updateFooter() {
  const tfoot = document.getElementById('unit-tfoot');
  if (!tfoot) return;
  if (!rows.length) { tfoot.innerHTML = ''; return; }
  const totals = rows.reduce((a, r) => {
    const c = compute(r);
    a.cost     += c.totalCost;
    a.logKtr   += c.logKtr;
    a.stor30   += c.storage30;
    a.comm     += c.commission;
    a.profit   += c.profit;
    a.revenue  += (+r.wb_price || 0);
    a.invested += c.invested;
    a.bprofit  += c.batchProfit;
    a.brev     += (+r.wb_price || 0) * (+r.quantity || 0);
    return a;
  }, {cost:0,logKtr:0,stor30:0,comm:0,profit:0,revenue:0,invested:0,bprofit:0,brev:0});

  const avgM  = totals.revenue > 0 ? totals.profit / totals.revenue * 100 : 0;
  const avgBM = totals.brev    > 0 ? totals.bprofit / totals.brev * 100   : 0;

  tfoot.innerHTML = `<tr>
    <td></td>
    <td class="left" colspan="2">Итого (${rows.length})</td>
    <td>${fmtR(totals.cost)}</td>
    <td></td><td></td><td></td><td></td>
    <td class="fcomp">${fmtR(totals.cost)}</td>
    <td></td><td></td><td class="left"></td><td></td>
    <td></td>
    <td class="fcomp">${fmtR(totals.stor30)}</td>
    <td></td>
    <td></td>
    <td></td><td></td><td></td>
    <td class="fcomp">${fmtR(totals.comm)}</td>
    <td class="fcomp ${profitCls(totals.profit)}">${fmtR(totals.profit)}</td>
    <td class="fcomp"><span class="mbadge ${mClass(avgM)}">${fmtP(avgM)}</span></td>
    <td class="fcomp"></td>
    <td class="fcomp"><span class="mbadge ${mClass(avgBM)}">${fmtP(avgBM)}</span></td>
  </tr>`;
}

// ─── Импорт из WB ────────────────────────────────────────────────────────────
async function openImport() {
  if (!currentProject) return;
  importArticles = [];
  document.getElementById('importTitle').textContent =
    `Артикулы из WB — ${currentProject} (30 дней)`;
  document.getElementById('importBody').innerHTML =
    '<div class="modal-loading">⏳ Загружаю данные из WB…</div>';
  document.getElementById('importSearch').value = '';
  document.getElementById('btnDoImport').disabled = true;
  document.getElementById('btnDoImport').textContent = 'Добавить 0 артикулов';
  document.getElementById('importOverlay').classList.add('open');

  try {
    const resp = await fetch('/api/unit-import-articles?project=' + encodeURIComponent(currentProject));
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    importArticles = data;
    renderImportList(importArticles);
  } catch (e) {
    document.getElementById('importBody').innerHTML =
      `<div class="modal-loading" style="color:var(--red)">❌ Ошибка: ${esc(e.message)}</div>`;
  }
}

function closeImport(e) {
  if (e && e.target !== document.getElementById('importOverlay')) return;
  document.getElementById('importOverlay').classList.remove('open');
}

// Набор уже существующих wb_article в текущем кабинете
function existingWbArticles() {
  return new Set(rows.map(r => String(r.wb_article)).filter(Boolean));
}

function renderImportList(articles, query = '') {
  const existing = existingWbArticles();
  const q = query.toLowerCase();
  const filtered = articles.filter(a =>
    !q ||
    String(a.wb_article).includes(q) ||
    (a.seller_article || '').toLowerCase().includes(q) ||
    (a.name || '').toLowerCase().includes(q)
  );

  if (!filtered.length) {
    document.getElementById('importBody').innerHTML =
      '<div class="modal-loading">Ничего не найдено</div>';
    updateImportBtn();
    return;
  }

  document.getElementById('importBody').innerHTML = filtered.map(a => {
    const isExist = existing.has(String(a.wb_article));
    return `<label class="import-item${isExist ? ' exists' : ''}">
      <input type="checkbox" data-id="${a.wb_article}" ${isExist ? '' : 'checked'}
        onchange="updateImportBtn()">
      <div class="import-item-info">
        <div class="import-item-name">${esc(a.seller_article || a.name || '—')}</div>
        <div class="import-item-meta">${a.wb_article}${isExist ? ' · уже добавлен' : ''}${a.brand ? ' · ' + esc(a.brand) : ''}</div>
      </div>
    </label>`;
  }).join('');

  updateImportBtn();
}

function filterImport(q) {
  renderImportList(importArticles, q);
}

function toggleAll() {
  const boxes = document.querySelectorAll('#importBody input[type=checkbox]');
  const anyUnchecked = [...boxes].some(b => !b.checked);
  boxes.forEach(b => b.checked = anyUnchecked);
  document.querySelector('.modal-sel-all').textContent = anyUnchecked ? 'Снять все' : 'Выбрать все';
  updateImportBtn();
}

function updateImportBtn() {
  const count = document.querySelectorAll('#importBody input[type=checkbox]:checked').length;
  const btn = document.getElementById('btnDoImport');
  btn.disabled = count === 0;
  btn.textContent = `Добавить ${count} артикул${pluralRu(count)}`;
}

function pluralRu(n) {
  if (n % 10 === 1 && n % 100 !== 11) return '';
  if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return 'а';
  return 'ов';
}

async function doImport() {
  const checked = [...document.querySelectorAll('#importBody input[type=checkbox]:checked')];
  const ids = new Set(checked.map(b => String(b.dataset.id)));
  const toAdd = importArticles.filter(a => ids.has(String(a.wb_article)));

  document.getElementById('importOverlay').classList.remove('open');

  for (const a of toAdd) {
    addRow({
      wb_article:     a.wb_article,
      seller_article: a.seller_article || '',
      brand:          a.brand || currentProject,
    });
  }
}

// ─── Вспомогательные ─────────────────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleTheme(){
  const t = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = t;
  localStorage.setItem('theme', t);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
document.body.dataset.theme = localStorage.getItem('theme') || 'dark';
renderContent();
</script>

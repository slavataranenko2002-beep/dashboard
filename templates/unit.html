<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Юнит-экономика</title>
<style>
:root{
  --bg:#0f1117;--bg2:#161b22;--bg3:#1c2333;--bg4:#21262d;
  --border:#30363d;--text:#e6edf3;--text2:#8b949e;--text3:#484f58;
  --blue:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;
  --comp-bg:#181e28;--comp-text:#8b949e;
}
[data-theme="light"]{
  --bg:#f6f8fa;--bg2:#fff;--bg3:#f0f2f5;--bg4:#e8ebf0;
  --border:#d0d7de;--text:#24292f;--text2:#656d76;--text3:#8c959f;
  --comp-bg:#f0f2f5;--comp-text:#656d76;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
.hdr{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;z-index:20}
.hdr-logo{font-weight:700;font-size:15px}
.hdr-sep{flex:1}
.hbtn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;white-space:nowrap;text-decoration:none}
.hbtn:hover{background:var(--bg4);color:var(--text)}
.hbtn.act{background:var(--blue);color:#fff;border-color:var(--blue)}
.theme-btn{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.toolbar-title{font-weight:600;font-size:14px;margin-right:4px}
.proj-select{padding:6px 12px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);font-size:13px;cursor:pointer;min-width:160px}
.proj-select:focus{outline:none;border-color:var(--blue)}
.btn-add{padding:6px 14px;border-radius:7px;border:none;background:var(--blue);
  color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn-add:hover{opacity:.85}
.btn-add:disabled{opacity:.4;cursor:default}
.save-indicator{font-size:12px;color:var(--text3);min-width:80px}
.save-indicator.saving{color:var(--yellow)}
.save-indicator.saved{color:var(--green)}
.tsep{width:1px;height:22px;background:var(--border)}

/* ── Table container ── */
.tbl-outer{flex:1;overflow:hidden;padding:0 20px 20px;display:flex;flex-direction:column}
#content{flex:1;min-height:0;display:flex;flex-direction:column}
.tbl-wrap{flex:1;min-height:0;margin-top:16px;border:1px solid var(--border);border-radius:10px;overflow:auto}
table{border-collapse:collapse;min-width:max-content;width:100%}

/* ── Header rows ── */
thead tr.grp-row th{
  background:#0f1e30;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:#5a89b0;padding:5px 10px;border-bottom:1px solid var(--border);
  text-align:center;white-space:nowrap;
  position:sticky;top:0;z-index:11}
thead tr.grp-row th.grp-results{background:#0d2137;color:#58a6ff;letter-spacing:.1em}
[data-theme="light"] thead tr.grp-row th{background:#dbeafe;color:#1d4ed8}
[data-theme="light"] thead tr.grp-row th.grp-results{background:#bfdbfe;color:#1e40af}
thead tr.col-row th{
  background:var(--bg3);font-size:11px;font-weight:600;color:var(--text2);
  padding:7px 8px;border-bottom:2px solid var(--border);white-space:nowrap;
  position:sticky;top:28px;z-index:10;text-align:right}
thead tr.col-row th.left{text-align:left}
thead tr.col-row th.comp{background:var(--comp-bg);color:var(--text3)}

/* ── Sticky columns ── */
.sc0{position:sticky;left:0;    width:36px; min-width:36px; z-index:4;background:var(--bg2)}
.sc1{position:sticky;left:36px; width:36px; min-width:36px; z-index:4;background:var(--bg2)}
.sc2{position:sticky;left:72px; width:150px;min-width:150px;z-index:4;background:var(--bg2)}
.sc3{position:sticky;left:222px;width:100px;min-width:100px;z-index:4;background:var(--bg2)}
thead .sc0,thead .sc1,thead .sc2,thead .sc3{z-index:13;background:inherit}
tbody tr:hover .sc0,tbody tr:hover .sc1,tbody tr:hover .sc2,tbody tr:hover .sc3{background:rgba(15,30,48,1)}

tfoot .sc0,tfoot .sc1,tfoot .sc2,tfoot .sc3{background:var(--bg4);z-index:4}
[data-theme="light"] .sc0,[data-theme="light"] .sc1,[data-theme="light"] .sc2,[data-theme="light"] .sc3{background:var(--bg2)}
[data-theme="light"] tbody tr:hover .sc0,[data-theme="light"] tbody tr:hover .sc1,
[data-theme="light"] tbody tr:hover .sc2,[data-theme="light"] tbody tr:hover .sc3{background:#edf2fb}
/* Shadow to show scroll */
.sc3::after{content:'';position:absolute;top:0;right:-8px;bottom:0;width:8px;
  background:linear-gradient(to right,rgba(0,0,0,.15),transparent);pointer-events:none}

/* ── Body rows ── */
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:rgba(88,166,255,.04)}
tbody tr:last-child{border-bottom:none}

/* Editable cell */
td.ed{padding:3px 4px;vertical-align:middle}
td.ed input,td.ed select{
  width:100%;border:none;background:transparent;color:var(--text);
  font-size:12px;font-family:inherit;padding:4px 5px;border-radius:4px;
  text-align:right;min-width:70px}
td.ed input[type=text],td.ed input.art{text-align:left;min-width:100px}
td.ed select{min-width:130px;cursor:pointer}
td.ed input:focus,td.ed select:focus{
  outline:none;background:rgba(88,166,255,.1);border:1px solid var(--blue)}
td.ed input:hover,td.ed select:hover{background:var(--bg3)}

/* Computed cell */
td.comp{
  background:var(--comp-bg);color:var(--comp-text);
  padding:5px 10px;text-align:right;white-space:nowrap;font-size:12px;
  font-variant-numeric:tabular-nums}
td.comp.profit-pos{color:var(--green)}
td.comp.profit-neg{color:var(--red)}
td.comp.profit-mid{color:var(--yellow)}

/* Checkbox cell */
td.cb-cell,th.cb-cell{width:32px;padding:3px 6px;text-align:center;vertical-align:middle}
td.cb-cell input[type=checkbox],th.cb-cell input[type=checkbox]{
  width:14px;height:14px;accent-color:var(--blue);cursor:pointer}
tbody tr.selected{background:rgba(88,166,255,.14)!important}
tbody tr.selected .sc0,tbody tr.selected .sc1,tbody tr.selected .sc2,tbody tr.selected .sc3{background:rgb(20,54,105)!important}
[data-theme="light"] tbody tr.selected{background:rgba(59,130,246,.12)!important}
[data-theme="light"] tbody tr.selected .sc0,[data-theme="light"] tbody tr.selected .sc1,[data-theme="light"] tbody tr.selected .sc2,[data-theme="light"] tbody tr.selected .sc3{background:rgb(186,220,255)!important}

/* Bulk edit bar */
.bulk-bar{display:none;align-items:center;gap:10px;padding:8px 20px;
  background:rgba(88,166,255,.08);border-bottom:1px solid rgba(88,166,255,.2);
  flex-shrink:0;flex-wrap:wrap}
.bulk-bar.open{display:flex}
.bulk-bar-info{font-size:13px;font-weight:600;color:var(--blue);white-space:nowrap}
.bulk-field{padding:5px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);font-size:12px;cursor:pointer}
.bulk-val{padding:5px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);font-size:12px;width:130px}
.bulk-val:focus,.bulk-field:focus{outline:none;border-color:var(--blue)}
.bulk-apply{padding:5px 14px;border-radius:6px;border:none;background:var(--blue);
  color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.bulk-apply:hover{opacity:.85}
.bulk-desel{padding:5px 10px;border-radius:6px;border:1px solid var(--border);
  background:none;color:var(--text2);font-size:12px;cursor:pointer;margin-left:auto}
.bulk-desel:hover{color:var(--text)}

/* Delete cell */
td.del-cell{width:32px;padding:3px 6px;text-align:center}
.del-btn{width:24px;height:24px;border-radius:5px;border:none;
  background:transparent;color:var(--text3);cursor:pointer;font-size:14px;line-height:1}
.del-btn:hover{background:rgba(248,81,73,.15);color:var(--red)}

/* Import modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;
  align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  width:520px;max-width:96vw;max-height:80vh;display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.5)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-weight:600;font-size:15px}
.modal-close{width:28px;height:28px;border-radius:5px;border:none;
  background:var(--bg3);color:var(--text2);cursor:pointer;font-size:16px}
.modal-close:hover{color:var(--text)}
.modal-search{padding:10px 20px;border-bottom:1px solid var(--border)}
.modal-search input{width:100%;padding:7px 10px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px}
.modal-search input:focus{outline:none;border-color:var(--blue)}
.modal-body{flex:1;overflow-y:auto;padding:8px 0}
.modal-loading{display:flex;align-items:center;justify-content:center;
  padding:40px;color:var(--text3);font-size:14px;gap:10px}
.import-item{display:flex;align-items:center;gap:10px;padding:7px 20px;cursor:pointer}
.import-item:hover{background:var(--bg3)}
.import-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);flex-shrink:0}
.import-item-info{flex:1;min-width:0}
.import-item-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.import-item-meta{font-size:11px;color:var(--text3);font-family:monospace}
.import-item.exists .import-item-name{color:var(--text3)}
.modal-ftr{padding:12px 20px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:10px}
.modal-sel-all{font-size:12px;color:var(--blue);cursor:pointer;border:none;
  background:none;padding:0;flex:1;text-align:left}
.btn-import{padding:7px 18px;border-radius:7px;border:none;background:var(--blue);
  color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn-import:hover{opacity:.85}
.btn-import:disabled{opacity:.4;cursor:default}

/* Tax select */
.tax-wrap{display:flex;align-items:center;gap:3px;padding:3px 4px}
.tax-sel{border:none;background:transparent;color:var(--text);font-size:11px;
  font-family:inherit;padding:2px 3px;border-radius:3px;cursor:pointer;max-width:110px}
.tax-sel:focus{outline:none;background:rgba(88,166,255,.1);border:1px solid var(--blue)}
.tax-pct-inp{width:42px;border:none;background:transparent;color:var(--text);
  font-size:11px;font-family:inherit;padding:2px 4px;border-radius:3px;text-align:right}
.tax-pct-inp:focus{outline:none;background:rgba(88,166,255,.1);border:1px solid var(--blue)}

/* Margin badge */
.mbadge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600}
.mbadge.hi{background:#1f3a2a;color:var(--green)}
.mbadge.mid{background:#2e2a1a;color:var(--yellow)}
.mbadge.lo{background:#2a1a1a;color:var(--red)}
[data-theme="light"] .mbadge.hi{background:#d2f4db;color:#1a7f37}
[data-theme="light"] .mbadge.mid{background:#fff3cd;color:#9a6700}
[data-theme="light"] .mbadge.lo{background:#ffe4e4;color:#cf222e}

/* Footer / summary */
tfoot td{
  background:var(--bg4);font-weight:600;font-size:12px;padding:6px 10px;
  border-top:2px solid var(--border);white-space:nowrap;text-align:right}
tfoot td.left{text-align:left;color:var(--text2)}
tfoot td.fcomp{background:var(--comp-bg)}

/* ── Sort / filter controls ── */
thead tr.col-row th{position:relative;white-space:nowrap}
.ch-lbl{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:2px}
.ch-lbl:hover{color:var(--text)}
.sort-ic{font-size:10px;color:var(--blue)}
.flt-btn{border:none;background:none;cursor:pointer;color:var(--text3);font-size:11px;
  padding:0 2px;border-radius:3px;line-height:1;margin-left:2px;vertical-align:middle;flex-shrink:0}
.flt-btn:hover,.flt-btn.active{color:var(--blue)}
.flt-btn.active{background:rgba(88,166,255,.15)}
/* ── Filter popup ── */
.flt-popup{position:fixed;z-index:200;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.45);width:220px;
  display:none;flex-direction:column;max-height:360px;font-size:12px}
.flt-popup.open{display:flex}
.flt-srch{padding:8px;border-bottom:1px solid var(--border);flex-shrink:0}
.flt-srch input{width:100%;padding:5px 8px;border-radius:5px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);font-size:12px;font-family:inherit}
.flt-srch input:focus{outline:none;border-color:var(--blue)}
.flt-all-row{padding:5px 10px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text2);flex-shrink:0}
.flt-list{flex:1;overflow-y:auto;padding:3px 0;min-height:0}
.flt-item{display:flex;align-items:center;gap:6px;padding:4px 10px;cursor:pointer}
.flt-item:hover{background:var(--bg3)}
.flt-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;color:var(--text)}
.flt-ftr{padding:7px 8px;border-top:1px solid var(--border);display:flex;gap:6px;flex-shrink:0}
.flt-ok{flex:1;padding:5px 0;border-radius:5px;border:none;background:var(--blue);
  color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.flt-ok:hover{opacity:.85}
.flt-rst{padding:5px 10px;border-radius:5px;border:1px solid var(--border);
  background:none;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit}
.flt-rst:hover{color:var(--text)}

/* Empty / no-project state */
.placeholder{display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:80px 24px;color:var(--text3);gap:14px;text-align:center}
.placeholder-icon{font-size:48px}
.placeholder-text{font-size:16px}
.placeholder-sub{font-size:13px;color:var(--text3)}
</style>
</head>
<body data-theme="dark">

<div class="hdr">
  <span class="hdr-logo">📊 Дашборд</span>
  <div class="hdr-sep"></div>
  <a href="/" class="hbtn">📋 Задачи</a>
  <a href="/plan-fact" class="hbtn">📊 План-Факт</a>
  <a href="/unit" class="hbtn act">💰 Юнит</a>
  {% if current_user.role == 'admin' %}
  <a href="/admin" class="hbtn">⚙️ Пользователи</a>
  {% endif %}
  <button class="hbtn theme-btn" onclick="toggleTheme()">🌙</button>
  <a href="/auth/logout" class="hbtn" style="color:var(--red)">Выйти</a>
</div>

<div class="toolbar">
  <span class="toolbar-title">💰 Юнит-экономика</span>
  <div class="tsep"></div>
  <select class="proj-select" id="projSelect" onchange="onProjectChange()">
    <option value="">— выберите кабинет —</option>
    {% for p in projects %}
    <option value="{{ p }}">{{ project_emoji[p] }} {{ p }}</option>
    {% endfor %}
  </select>
  <button class="btn-add" id="btnAdd" disabled onclick="addRow()">+ Строка</button>
  <button class="btn-add" id="btnImport" disabled onclick="openImport()"
    style="background:var(--bg3);color:var(--text2);border:1px solid var(--border)">
    📥 Загрузить из WB
  </button>
  <button class="btn-add" id="btnRefresh" disabled onclick="refreshWB()"
    style="background:var(--bg3);color:var(--text2);border:1px solid var(--border)">
    🔄 Обновить из WB
  </button>
  <button class="btn-add" id="btnExcel" disabled onclick="exportExcel()"
    style="background:var(--bg3);color:var(--text2);border:1px solid var(--border)">
    📊 Excel
  </button>
  <div class="tsep"></div>
  <span class="save-indicator" id="saveInd"></span>
</div>

<!-- Bulk edit bar -->
<div class="bulk-bar" id="bulkBar">
  <span class="bulk-bar-info" id="bulkInfo">Выбрано 0</span>
  <div class="tsep"></div>
  <select class="bulk-field" id="bulkField" onchange="onBulkFieldChange()">
    <optgroup label="Идентификация">
      <option value="brand">Бренд</option>
    </optgroup>
    <optgroup label="Себестоимость">
      <option value="cost_price">Себест. ₽</option>
      <option value="packaging">Упаковка ₽</option>
      <option value="logistics_to_wb">Лог. до ВБ ₽</option>
      <option value="overhead">Накладные ₽</option>
      <option value="defect_pct">Брак %</option>
    </optgroup>
    <optgroup label="Параметры ВБ">
      <option value="liters">Литраж</option>
      <option value="redemption_pct">% выкупа</option>
      <option value="warehouse">Склад</option>
      <option value="irp">ИРП</option>
      <option value="logistics_ktr">Лог+КТР (ручное)</option>
    </optgroup>
    <optgroup label="Цена и реклама">
      <option value="commission_pct">Комиссия %</option>
      <option value="wb_price">Цена ВБ ₽</option>
      <option value="spp_pct">СПП %</option>
      <option value="drr_pct">ДРР %</option>
      <option value="drr_external_rub">ДРР ₽</option>
    </optgroup>
    <optgroup label="Налог">
      <option value="tax_pct">Налог %</option>
    </optgroup>
    <optgroup label="Прочее">
      <option value="stock">Остаток</option>
    </optgroup>
  </select>
  <select class="bulk-val" id="bulkWarehouseVal" style="display:none">
    <option value="">— склад —</option>
  </select>
  <input class="bulk-val" id="bulkTextVal" type="text" placeholder="Значение" style="display:none">
  <input class="bulk-val" id="bulkNumVal" type="number" step="any" placeholder="Значение">
  <button class="bulk-apply" onclick="applyBulk()">Применить</button>
  <button class="bulk-apply" onclick="deleteBulk()"
    style="background:var(--red);margin-left:4px">🗑 Удалить</button>
  <button class="bulk-desel" onclick="deselectAll()">Снять выделение</button>
</div>

<!-- Import modal -->
<div class="modal-overlay" id="importOverlay" onclick="closeImport(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hdr">
      <span class="modal-title" id="importTitle">Загрузка артикулов из WB</span>
      <button class="modal-close" onclick="closeImport()">✕</button>
    </div>
    <div class="modal-search">
      <input type="text" id="importSearch" placeholder="Поиск по артикулу или названию…"
        oninput="filterImport(this.value)">
    </div>
    <div class="modal-body" id="importBody">
      <div class="modal-loading">⏳ Загрузка данных из WB…</div>
    </div>
    <div class="modal-ftr">
      <button class="modal-sel-all" onclick="toggleAll()">Выбрать все</button>
      <button class="btn-import" id="btnDoImport" disabled onclick="doImport()">
        Добавить 0 артикулов
      </button>
    </div>
  </div>
</div>

<!-- Column filter popup -->
<div id="filterPopup" class="flt-popup">
  <div class="flt-srch"><input id="fltSearchInp" type="text" placeholder="Поиск значения…" oninput="onFltSearch(this.value)"></div>
  <label class="flt-all-row">
    <input type="checkbox" id="fltAll" onchange="fltToggleAll(this.checked)"> Выбрать все
  </label>
  <div id="fltList" class="flt-list"></div>
  <div class="flt-ftr">
    <button class="flt-ok" onclick="applyColFilter()">OK</button>
    <button class="flt-rst" onclick="resetColFilter()">Сбросить</button>
  </div>
</div>

<div class="tbl-outer">
  <div id="content"></div>
</div>

<script>
// ─── Данные ──────────────────────────────────────────────────────────────────
const PROJECTS_DATA = {{ projects | tojson }};
const WAREHOUSE_COEFS = {
  'Обухово СГТ':75,'Голицыно СГТ':75,'Радумля СГТ':95,'Шушары СГТ':95,
  'Волгоград':110,'Рязань':120,'Маркетплейс':125,'Подольск 4':125,'Атакент':125,
  'Сабурово':130,'Невинномысск':130,'Краснодар':130,'Владимир':140,'Тула':145,
  'Астана Карагандинское шоссе':145,'Екатеринбург - Перспективный 12':150,
  'Котовск':150,'Электросталь':170,'Обухово':170,'Щербинка':190,
  'Белая дача':195,'Подольск':200,'Коледино':205,'Казань':210,
  'Екатеринбург - Испытателей 14г':220,'Хабаровск':220,'Чехов 2':260,
  'Санкт-Петербург Уткина Заводь':270,'Белые Столбы':280,'Новосибирск':445
};
const WAREHOUSES = Object.keys(WAREHOUSE_COEFS);

// ─── Системы налогообложения ──────────────────────────────────────────────────
const TAX_PRESETS_DEFAULT = [
  {label:'УСН 6%',   pct:6},
  {label:'УСН 7%',   pct:7},
  {label:'УСН 8%',   pct:8},
  {label:'УСН 10%',  pct:10},
  {label:'УСН 15%',  pct:15},
  {label:'УСН 6% + НДС 5%', pct:11},
  {label:'УСН 6% + НДС 20%',pct:26},
  {label:'ОСНО НДС 20%',    pct:20},
];
function loadTaxPresets() {
  try { return JSON.parse(localStorage.getItem('taxPresets') || 'null') || TAX_PRESETS_DEFAULT; }
  catch { return TAX_PRESETS_DEFAULT; }
}
function saveTaxPresets(list) { localStorage.setItem('taxPresets', JSON.stringify(list)); }
let TAX_PRESETS = loadTaxPresets();

function taxOptions(selectedLabel) {
  const opts = TAX_PRESETS.map(t =>
    `<option value="${t.pct}" data-label="${esc(t.label)}" ${t.label===selectedLabel?'selected':''}>${esc(t.label)}</option>`
  ).join('');
  return opts + `<option value="__custom__">+ Своя…</option>`;
}

function onTaxSelect(key, selectEl) {
  const val = selectEl.value;
  if (val === '__custom__') {
    const label = prompt('Название системы (напр. УСН 6%):');
    const pct   = parseFloat(prompt('Ставка в % (напр. 6):'));
    if (!label || isNaN(pct)) { selectEl.value = ''; return; }
    TAX_PRESETS.push({label, pct});
    saveTaxPresets(TAX_PRESETS);
    // Перерисовываем select этой строки
    const row = rows.find(r => r._key === key);
    if (row) { row.tax_system = label; row.tax_pct = pct; row._dirty = true; }
    selectEl.outerHTML = `<select class="tax-sel" onchange="onTaxSelect('${key}',this)">${taxOptions(label)}</select>`;
    const tr = document.querySelector(`tr[data-key="${key}"]`);
    const inp = tr?.querySelector('.tax-pct-inp');
    if (inp) inp.value = pct;
    updateComputedCells(key);
    schedSave(key);
    return;
  }
  const chosen = TAX_PRESETS.find(t => String(t.pct) === val) || TAX_PRESETS.find(t => t.label === selectEl.selectedOptions[0]?.dataset.label);
  if (!chosen) return;
  onInput(key, 'tax_system', chosen.label);
  onInput(key, 'tax_pct', chosen.pct);
  const tr = document.querySelector(`tr[data-key="${key}"]`);
  const inp = tr?.querySelector('.tax-pct-inp');
  if (inp) inp.value = chosen.pct;
}

let rows = [];       // [{id, _key, _dirty, project, ...fields}]
let currentProject = '';
let saveTimers = {};
let keySeq = 0;
const newKey = () => 'k' + (++keySeq);
let importArticles = [];   // [{wb_article, seller_article, name, brand}]
let selectedKeys = new Set();

// ─── Sort / Filter ───────────────────────────────────────────────────────────
let sortCol = null, sortDir = 0; // 1=asc, -1=desc, 0=none
let colFilters = {};              // {colKey: Set<string>} — no key = no filter
let _fltOpenCol = null, _fltTempVals = null;

// Column definitions (defined after compute is declared below, so we use lazy getters)
const COL_DEFS = [
  {k:'seller_article',   get:r=>r.seller_article||'',                         type:'text'},
  {k:'wb_article',       get:r=>String(r.wb_article||''),                     type:'text'},
  {k:'cost_price',       get:r=>+r.cost_price||0,                             type:'num'},
  {k:'packaging',        get:r=>+r.packaging||0,                              type:'num'},
  {k:'logistics_to_wb',  get:r=>+r.logistics_to_wb||0,                        type:'num'},
  {k:'overhead',         get:r=>+r.overhead||0,                               type:'num'},
  {k:'defect_pct',       get:r=>+r.defect_pct||0,                             type:'num'},
  {k:'totalCost',        get:r=>Math.round(compute(r).totalCost),             type:'num'},
  {k:'liters',           get:r=>+r.liters||Math.round(compute(r).liters*10)/10,type:'num'},
  {k:'redemption_pct',   get:r=>+r.redemption_pct||100,                       type:'num'},
  {k:'warehouse',        get:r=>r.warehouse||'',                              type:'text'},
  {k:'irp',              get:r=>+r.irp||1,                                    type:'num'},
  {k:'logKtr',           get:r=>Math.round(compute(r).logKtr),                type:'num'},
  {k:'storage30',        get:r=>Math.round(compute(r).storage30),             type:'num'},
  {k:'commission_pct',   get:r=>+r.commission_pct||36,                        type:'num'},
  {k:'wb_price',         get:r=>+r.wb_price||0,                               type:'num'},
  {k:'spp_pct',          get:r=>+r.spp_pct||0,                                type:'num'},
  {k:'clientPrice',      get:r=>Math.round(compute(r).clientPrice),           type:'num'},
  {k:'tax_system',       get:r=>r.tax_system||'',                             type:'text'},
  {k:'usn',              get:r=>Math.round(compute(r).usn),                   type:'num'},
  {k:'drr_pct',          get:r=>+r.drr_pct||0,                                type:'num'},
  {k:'drr_external_rub', get:r=>+r.drr_external_rub||0,                       type:'num'},
  {k:'stock',            get:r=>+r.stock||0,                                  type:'num'},
  {k:'commission',       get:r=>Math.round(compute(r).commission),            type:'num'},
  {k:'profit',           get:r=>Math.round(compute(r).profit),                type:'num'},
  {k:'margin',           get:r=>Math.round(compute(r).margin*10)/10,          type:'num'},
  {k:'roi',              get:r=>Math.round(compute(r).roi*10)/10,             type:'num'},
  {k:'batchMargin',      get:r=>Math.round(compute(r).batchMargin*10)/10,     type:'num'},
];
const COL_MAP = Object.fromEntries(COL_DEFS.map(c => [c.k, c]));

function filteredSortedRows() {
  let res = rows.filter(r => {
    for (const [k, allowed] of Object.entries(colFilters)) {
      if (!allowed || !allowed.size) continue;
      const def = COL_MAP[k]; if (!def) continue;
      if (!allowed.has(String(def.get(r)))) return false;
    }
    return true;
  });
  if (sortCol && sortDir) {
    const def = COL_MAP[sortCol];
    if (def) res = [...res].sort((a, b) => {
      const va = def.get(a), vb = def.get(b);
      return def.type === 'num' ? sortDir * (va - vb)
                                 : sortDir * String(va).localeCompare(String(vb), 'ru');
    });
  }
  return res;
}

function thSF(col, label, extraCls, title) {
  const cls = extraCls || '';
  const ti = title ? ` title="${title}"` : '';
  const sortIc = sortCol === col ? (sortDir === 1 ? ' ↑' : ' ↓') : '';
  const active = colFilters[col] ? ' active' : '';
  return `<th${cls ? ' class="' + cls + '"' : ''}${ti} data-col="${col}">` +
    `<span class="ch-lbl" onclick="toggleSort('${col}')">${label}<span class="sort-ic" id="si-${col}">${sortIc}</span></span>` +
    `<button class="flt-btn${active}" id="fb-${col}" onclick="openFilter(event,'${col}')">▾</button>` +
    `</th>`;
}

function toggleSort(col) {
  if (sortCol === col) {
    sortDir = sortDir === 1 ? -1 : sortDir === -1 ? 0 : 1;
    if (!sortDir) sortCol = null;
  } else { sortCol = col; sortDir = 1; }
  updateHeaderState();
  reRenderBody();
}

function openFilter(ev, col) {
  ev.stopPropagation();
  _fltOpenCol = col;
  const def = COL_MAP[col];
  const allVals = [...new Set(rows.map(r => String(def.get(r))))].sort(
    def.type === 'num' ? (a, b) => +a - +b : (a, b) => a.localeCompare(b, 'ru')
  );
  const existing = colFilters[col];
  _fltTempVals = existing ? new Set(existing) : new Set(allVals);
  document.getElementById('fltSearchInp').value = '';
  const popup = document.getElementById('filterPopup');
  popup._allVals = allVals;
  renderFltList(allVals);
  const rect = ev.target.getBoundingClientRect();
  popup.style.left = Math.min(rect.left, window.innerWidth - 230) + 'px';
  popup.style.top  = Math.min(rect.bottom + 4, window.innerHeight - 370) + 'px';
  popup.classList.add('open');
  document.getElementById('fltSearchInp').focus();
}

function closeFilter() {
  document.getElementById('filterPopup').classList.remove('open');
  _fltOpenCol = null;
}

function applyColFilter() {
  if (!_fltOpenCol) return;
  const def = COL_MAP[_fltOpenCol];
  const allCount = new Set(rows.map(r => String(def.get(r)))).size;
  if (_fltTempVals.size >= allCount) delete colFilters[_fltOpenCol];
  else colFilters[_fltOpenCol] = new Set(_fltTempVals);
  updateHeaderState();
  closeFilter();
  reRenderBody();
}

function resetColFilter() {
  if (!_fltOpenCol) return;
  delete colFilters[_fltOpenCol];
  updateHeaderState();
  closeFilter();
  reRenderBody();
}

function onFltSearch(q) {
  const popup = document.getElementById('filterPopup');
  renderFltList(popup._allVals, q);
}

function renderFltList(allVals, q) {
  const ql = (q || '').toLowerCase();
  const visible = ql ? allVals.filter(v => String(v).toLowerCase().includes(ql)) : allVals;
  document.getElementById('fltList').innerHTML = visible.map(v =>
    `<label class="flt-item"><input type="checkbox" value="${esc(v)}" ${_fltTempVals.has(v) ? 'checked' : ''}
      onchange="fltItemChange(this)"><span>${v === '' ? '<em style="color:var(--text3)">пусто</em>' : esc(String(v))}</span></label>`
  ).join('');
  updateFltAll();
}

function fltItemChange(cb) {
  if (cb.checked) _fltTempVals.add(cb.value);
  else _fltTempVals.delete(cb.value);
  updateFltAll();
}

function fltToggleAll(checked) {
  document.getElementById('fltList').querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.checked = checked;
    if (checked) _fltTempVals.add(cb.value); else _fltTempVals.delete(cb.value);
  });
}

function updateFltAll() {
  const boxes = [...document.getElementById('fltList').querySelectorAll('input[type=checkbox]')];
  const n = boxes.filter(b => b.checked).length;
  const all = document.getElementById('fltAll');
  all.checked = n === boxes.length && boxes.length > 0;
  all.indeterminate = n > 0 && n < boxes.length;
}

function updateHeaderState() {
  document.querySelectorAll('thead .sort-ic').forEach(el => { el.textContent = ''; });
  if (sortCol) {
    const si = document.getElementById('si-' + sortCol);
    if (si) si.textContent = sortDir === 1 ? ' ↑' : ' ↓';
  }
  document.querySelectorAll('.flt-btn').forEach(btn => {
    const col = btn.id.slice(3); // remove 'fb-'
    btn.classList.toggle('active', !!colFilters[col]);
  });
}

function reRenderBody() {
  const tbody = document.getElementById('unit-tbody');
  if (!tbody) return;
  const dr = filteredSortedRows();
  tbody.innerHTML = dr.map(r =>
    `<tr data-key="${r._key}"${selectedKeys.has(r._key) ? ' class="selected"' : ''}>${rowHTML(r)}</tr>`
  ).join('');
  updateFooter();
}

// ─── Формулы ─────────────────────────────────────────────────────────────────
function compute(r) {
  const cp  = +r.cost_price     || 0;
  const lw  = +r.logistics_to_wb|| 0;
  const pkg = +r.packaging      || 0;
  const ovh = +r.overhead       || 0;
  const def = +r.defect_pct     || 0;
  const wp  = +r.wb_price       || 0;
  const com = +r.commission_pct || 36;
  const red = +r.redemption_pct || 100;
  const irp = +r.irp            || 1.0;
  const dp  = +r.drr_pct        || 0;
  const de  = +r.drr_external_rub || 0;
  const qty = +r.stock       || 0;

  const spp    = +r.spp_pct    || 0;
  const taxPct = +r.tax_pct   || 7;
  const totalCost = cp + lw + pkg + ovh;

  const w = +r.width_cm, l = +r.length_cm, h = +r.height_cm;
  const liters = (w && l && h) ? w * l * h / 1000 : (+r.liters || 0);
  const wCoef  = WAREHOUSE_COEFS[r.warehouse] || 0;

  const storageDay = (liters && wCoef) ? 0.08 * liters * wCoef / 100 : (+r.storage_per_day || 0);
  const storage30  = storageDay * 30;

  let logKtr;
  if (r.logistics_ktr !== null && r.logistics_ktr !== undefined && r.logistics_ktr !== '') {
    logKtr = +r.logistics_ktr;
  } else if (liters && wCoef && red > 0) {
    logKtr = (223.2 + 2.1 * liters) * wCoef / 100 * irp / (red / 100);
  } else {
    logKtr = 0;
  }

  const commission  = wp * com / 100;
  const wbClub      = wp * 0.95;
  const usn         = wp * taxPct / 100;
  const drrRub      = wp * dp / 100 + de;
  const brakCost    = totalCost * def / 100;
  const revenue     = wp - commission - logKtr - storage30 - usn - drrRub;
  const profit      = revenue - totalCost - brakCost;
  const margin      = wp > 0 ? profit / wp * 100 : 0;
  const roi         = totalCost > 0 ? profit / totalCost * 100 : 0;
  const batchProfit = profit * qty;
  const batchMargin = (qty > 0 && wp > 0) ? batchProfit / (wp * qty) * 100 : 0;
  const invested    = totalCost * qty;

  const clientPrice = wp > 0 ? wp * (1 - spp / 100) : 0;

  return {totalCost, liters, wCoef, storageDay, storage30,
          logKtr, commission, wbClub, usn, taxPct, drrRub, brakCost,
          revenue, profit, margin, roi, batchProfit, batchMargin, invested,
          clientPrice};
}

// ─── Форматирование ──────────────────────────────────────────────────────────
const fmt2 = v => v != null && !isNaN(v) ? Math.round(v).toLocaleString('ru-RU') : '—';
const fmtR = v => v != null && !isNaN(v) ? (v < 0 ? '−' : '') + '₽ ' + Math.abs(Math.round(v)).toLocaleString('ru-RU') : '—';
const fmtP = v => v != null && !isNaN(v) ? v.toFixed(1) + '%' : '—';

function mClass(m) {
  if (isNaN(m)) return '';
  return m >= 20 ? 'hi' : m >= 10 ? 'mid' : 'lo';
}
function profitCls(v) {
  return v > 0 ? 'profit-pos' : v < 0 ? 'profit-neg' : '';
}

// ─── Загрузка ─────────────────────────────────────────────────────────────────
async function onProjectChange() {
  currentProject = document.getElementById('projSelect').value;
  selectedKeys = new Set();
  updateBulkBar();
  const active = !!currentProject;
  document.getElementById('btnAdd').disabled     = !active;
  document.getElementById('btnImport').disabled  = !active;
  document.getElementById('btnRefresh').disabled = !active;
  document.getElementById('btnExcel').disabled   = !active;
  if (!currentProject) { rows = []; renderContent(); return; }

  // Загружаем из БД
  const resp = await fetch('/api/unit-rows?project=' + encodeURIComponent(currentProject));
  const data = await resp.json();
  rows = Array.isArray(data) ? data : [];
  rows.forEach(r => { r._key = newKey(); r._dirty = false; });

  // Первый раз (или только пустые строки) — авто-импорт из WB без модалки
  const hasRealArticles = rows.some(r => r.wb_article);
  if (!hasRealArticles) {
    renderContent('auto-import');
    try {
      const ir = await fetch('/api/unit-auto-import?project=' + encodeURIComponent(currentProject), {method:'POST'});
      const ij = await ir.json();
      if (ij.error) throw new Error(ij.error);
      rows = ij.rows || [];
      rows.forEach(r => { r._key = newKey(); r._dirty = false; });
    } catch(e) {
      // Показываем ошибку в плейсхолдере
      document.getElementById('content').innerHTML = `<div class="placeholder">
        <div class="placeholder-icon">❌</div>
        <div class="placeholder-text">Не удалось загрузить артикулы из WB</div>
        <div class="placeholder-sub" style="color:var(--red)">${esc(e.message)}</div>
        <div class="placeholder-sub" style="margin-top:8px">Нажмите «📥 Загрузить из WB» чтобы попробовать вручную</div>
      </div>`;
      return;
    }
  }
  renderContent();
}

// ─── Автосохранение ──────────────────────────────────────────────────────────
function schedSave(key) {
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(() => doSave(key), 600);
  showInd('saving');
}

async function doSave(key) {
  const r = rows.find(x => x._key === key);
  if (!r || !r._dirty) return;
  const body = {...r, project: currentProject};
  delete body._key; delete body._dirty;
  const url  = r.id ? `/api/unit-rows/${r.id}` : '/api/unit-rows';
  const meth = r.id ? 'PUT' : 'POST';
  const res  = await fetch(url, {method: meth, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const json = await res.json();
  if (json.id) r.id = json.id;
  r._dirty = false;
  // update delete button
  const tr = document.querySelector(`tr[data-key="${key}"]`);
  if (tr) tr.querySelector('.del-btn').dataset.id = r.id || '';
  checkAllSaved();
}

function showInd(state) {
  const el = document.getElementById('saveInd');
  el.className = 'save-indicator ' + state;
  el.textContent = state === 'saving' ? '⏳ Сохранение…' : state === 'saved' ? '✓ Сохранено' : '';
  if (state === 'saved') setTimeout(() => { if (el.textContent === '✓ Сохранено') el.textContent = ''; }, 2000);
}

function checkAllSaved() {
  if (!rows.some(r => r._dirty)) showInd('saved');
}

// ─── Изменение ячейки ────────────────────────────────────────────────────────
function onInput(key, field, val) {
  const r = rows.find(x => x._key === key);
  if (!r) return;
  const numFields = ['cost_price','logistics_to_wb','packaging','overhead','defect_pct',
    'width_cm','length_cm','height_cm','liters','redemption_pct','irp','logistics_ktr',
    'commission_pct','wb_price','drr_pct','drr_external_rub','stock'];
  r[field] = numFields.includes(field) ? (val === '' ? (field === 'logistics_ktr' || field === 'liters' ? null : 0) : +val) : val;
  r._dirty = true;
  updateComputedCells(key);
  schedSave(key);
}

function updateComputedCells(key) {
  const r = rows.find(x => x._key === key);
  if (!r) return;
  const c = compute(r);
  const tr = document.querySelector(`tr[data-key="${key}"]`);
  if (!tr) return;
  const set = (cls, val, extra) => {
    const el = tr.querySelector('.' + cls);
    if (!el) return;
    el.textContent = val;
    el.className = el.className.replace(/profit-\w+/g, '').replace(/mbadge \w+/g, 'mbadge').trim();
    if (extra) el.classList.add(...extra.split(' '));
  };
  set('cv-totalcost',   fmtR(c.totalCost));
  set('cv-clientprice', fmtR(c.clientPrice));
  set('cv-usn',         fmtR(c.usn));
  set('cv-logtgtr',    r.logistics_ktr !== null && r.logistics_ktr !== undefined && r.logistics_ktr !== ''
                         ? fmtR(+r.logistics_ktr) : fmtR(c.logKtr));
  set('cv-stor30',     fmtR(c.storage30));
  set('cv-commission', fmtR(c.commission));
  const pm = tr.querySelector('.cv-profit');
  if (pm) { pm.textContent = fmtR(c.profit); pm.className = 'comp cv-profit ' + profitCls(c.profit); }
  const mm = tr.querySelector('.cv-margin');
  if (mm) { mm.innerHTML = `<span class="mbadge ${mClass(c.margin)}">${fmtP(c.margin)}</span>`; }
  const rm = tr.querySelector('.cv-roi');
  if (rm) { rm.textContent = fmtP(c.roi); rm.className = 'comp cv-roi ' + profitCls(c.roi); }
  const bm = tr.querySelector('.cv-bmargin');
  if (bm) { bm.innerHTML = `<span class="mbadge ${mClass(c.batchMargin)}">${fmtP(c.batchMargin)}</span>`; }
  updateFooter();
}

// ─── Добавить строку ─────────────────────────────────────────────────────────
function makeEmptyRow(overrides = {}) {
  return {
    id: null, _key: newKey(), _dirty: true, project: currentProject,
    brand: currentProject, wb_article: '', seller_article: '',
    cost_price: 0, logistics_to_wb: 0, packaging: 0, overhead: 0, defect_pct: 0,
    width_cm: null, length_cm: null, height_cm: null, liters: null,
    redemption_pct: 100, warehouse: '', irp: 1.0, logistics_ktr: null,
    reception_coef: 'x0', storage_per_day: 0,
    commission_pct: 36, wb_price: 0, spp_pct: 0, drr_pct: 0, drr_external_rub: 0, stock: 0,
    tax_system: 'УСН 7%', tax_pct: 7,
    ...overrides
  };
}

function addRow(overrides = {}) {
  if (!currentProject) return;
  const r = makeEmptyRow(overrides);
  rows.push(r);

  // Если таблица ещё не отрисована (пустой кабинет) — рендерим всё заново
  let tbody = document.getElementById('unit-tbody');
  if (!tbody) {
    renderContent();
  } else {
    reRenderBody();
  }

  // Фокус на первую ячейку новой строки
  setTimeout(() => {
    const tr = document.querySelector(`tr[data-key="${r._key}"]`);
    if (tr) tr.querySelector('.inp-seller')?.focus();
  }, 0);

  schedSave(r._key);
  return r._key;
}

// ─── Удалить строку ──────────────────────────────────────────────────────────
async function deleteRow(key, id) {
  if (!confirm('Удалить эту строку?')) return;
  if (id) await fetch(`/api/unit-rows/${id}`, {method:'DELETE'});
  rows = rows.filter(r => r._key !== key);
  const tr = document.querySelector(`tr[data-key="${key}"]`);
  if (tr) tr.remove();
  updateFooter();
}

// ─── Рендер таблицы ──────────────────────────────────────────────────────────
function warehouseOptions(selected) {
  return WAREHOUSES.map(w =>
    `<option value="${w}" ${w===selected?'selected':''}>${w}</option>`
  ).join('');
}

function rowHTML(r) {
  const c   = compute(r);
  const key = r._key;
  const n   = (v, field, cls='', ph='0', min='') =>
    `<input type="number" class="${cls}" value="${v??''}" placeholder="${ph}"
      ${min?'min="'+min+'"':''} step="any"
      oninput="onInput('${key}','${field}',this.value)">`;
  const s   = (v, field, cls='') =>
    `<input type="text" class="${cls} art" value="${esc(v??'')}"
      oninput="onInput('${key}','${field}',this.value)">`;

  const lktr = r.logistics_ktr !== null && r.logistics_ktr !== undefined && r.logistics_ktr !== ''
    ? +r.logistics_ktr : c.logKtr;

  const chk = selectedKeys.has(key);

function updateFooter() {
  const tfoot = document.getElementById('unit-tfoot');
  if (!tfoot) return;
  const dr = filteredSortedRows();
  if (!dr.length) { tfoot.innerHTML = ''; return; }
  const totals = dr.reduce((a, r) => {
    const c = compute(r);
    a.cost     += c.totalCost;
    a.logKtr   += c.logKtr;
    a.stor30   += c.storage30;
    a.comm     += c.commission;
    a.profit   += c.profit;
    a.revenue  += (+r.wb_price || 0);
    a.invested += c.invested;
    a.bprofit  += c.batchProfit;
    a.brev     += (+r.wb_price || 0) * (+r.stock || 0);
    return a;
  }, {cost:0,logKtr:0,stor30:0,comm:0,profit:0,revenue:0,invested:0,bprofit:0,brev:0});

  const avgM  = totals.revenue > 0 ? totals.profit / totals.revenue * 100 : 0;
  const avgBM = totals.brev    > 0 ? totals.bprofit / totals.brev * 100   : 0;

  tfoot.innerHTML = `<tr>
    <td class="sc0"></td>
    <td class="sc1"></td>
    <td class="left sc2" colspan="2">Итого (${dr.length}${dr.length !== rows.length ? '/'+rows.length : ''})</td>
    <td>${fmtR(totals.cost)}</td>
    <td></td><td></td><td></td><td></td>
    <td class="fcomp">${fmtR(totals.cost)}</td>
    <td></td><td></td><td class="left"></td><td></td>
    <td></td>
    <td class="fcomp">${fmtR(totals.stor30)}</td>
    <td></td>
    <td></td>
    <td></td><td></td><td></td>
    <td class="fcomp"></td><td class="fcomp"></td>
    <td class="fcomp">${fmtR(totals.comm)}</td>
    <td class="fcomp ${profitCls(totals.profit)}">${fmtR(totals.profit)}</td>
    <td class="fcomp"><span class="mbadge ${mClass(avgM)}">${fmtP(avgM)}</span></td>
    <td class="fcomp"></td>
    <td class="fcomp"><span class="mbadge ${mClass(avgBM)}">${fmtP(avgBM)}</span></td>
  </tr>`;
}

// ─── Обновление из WB ────────────────────────────────────────────────────────
async function refreshWB() {
  if (!currentProject) return;
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true; btn.textContent = '⏳ Обновляем…';
  try {
    const r = await fetch('/api/unit-refresh?project=' + encodeURIComponent(currentProject), {method:'POST'});
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    // Перезагружаем строки из БД
    const resp = await fetch('/api/unit-rows?project=' + encodeURIComponent(currentProject));
    rows = await resp.json();
    rows.forEach(r => { r._key = newKey(); r._dirty = false; });
    renderContent();
    showInd('saved');
    btn.textContent = `✓ Обновлено ${j.updated}`;
    setTimeout(() => { btn.textContent = '🔄 Обновить из WB'; btn.disabled = false; }, 3000);
  } catch(e) {
    alert('Ошибка обновления: ' + e.message);
    btn.textContent = '🔄 Обновить из WB'; btn.disabled = false;
  }
}

function exportExcel() {
  if (!currentProject) return;
  window.location.href = '/api/unit-export-excel?project=' + encodeURIComponent(currentProject);
}

// ─── Массовое редактирование ─────────────────────────────────────────────────
const BULK_NUM_FIELDS = new Set([
  'commission_pct','redemption_pct','irp','drr_pct','drr_external_rub',
  'logistics_to_wb','overhead','packaging','defect_pct','wb_price','cost_price',
  'spp_pct','liters','logistics_ktr','stock','tax_pct'
]);
const BULK_TEXT_FIELDS = new Set(['brand']);

function onRowCheck(key, checked) {
  if (checked) selectedKeys.add(key); else selectedKeys.delete(key);
  const tr = document.querySelector(`tr[data-key="${key}"]`);
  if (tr) tr.classList.toggle('selected', checked);
  updateBulkBar();
}

function toggleSelectAll(checked) {
  selectedKeys = checked ? new Set(rows.map(r => r._key)) : new Set();
  document.querySelectorAll('#unit-tbody tr').forEach(tr => {
    tr.classList.toggle('selected', checked);
    const cb = tr.querySelector('td.cb-cell input');
    if (cb) cb.checked = checked;
  });
  updateBulkBar();
}

function deselectAll() {
  toggleSelectAll(false);
  const cbAll = document.getElementById('cbAll');
  if (cbAll) cbAll.checked = false;
}

function updateBulkBar() {
  const n = selectedKeys.size;
  const bar = document.getElementById('bulkBar');
  bar.classList.toggle('open', n > 0);
  document.getElementById('bulkInfo').textContent = `Выбрано ${n}`;
  // sync "select all" checkbox
  const cbAll = document.getElementById('cbAll');
  if (cbAll) {
    cbAll.checked = n > 0 && n === rows.length;
    cbAll.indeterminate = n > 0 && n < rows.length;
  }
}

function onBulkFieldChange() {
  const field = document.getElementById('bulkField').value;
  const isWh  = field === 'warehouse';
  const isTxt = BULK_TEXT_FIELDS.has(field);
  document.getElementById('bulkWarehouseVal').style.display = isWh  ? '' : 'none';
  document.getElementById('bulkTextVal').style.display      = isTxt ? '' : 'none';
  document.getElementById('bulkNumVal').style.display       = (!isWh && !isTxt) ? '' : 'none';
}

async function deleteBulk() {
  const n = selectedKeys.size;
  if (!n) return;
  if (!confirm(`Удалить ${n} строк${n === 1 ? 'у' : n < 5 ? 'и' : ''}?`)) return;
  const keys = [...selectedKeys];
  for (const key of keys) {
    const r = rows.find(x => x._key === key);
    if (!r) continue;
    if (r.id) await fetch(`/api/unit-rows/${r.id}`, {method: 'DELETE'});
    rows = rows.filter(x => x._key !== key);
    const tr = document.querySelector(`tr[data-key="${key}"]`);
    if (tr) tr.remove();
  }
  selectedKeys = new Set();
  updateBulkBar();
  updateFooter();
}

function applyBulk() {
  const field = document.getElementById('bulkField').value;
  const isWh  = field === 'warehouse';
  const isTxt = BULK_TEXT_FIELDS.has(field);
  const rawVal = isWh  ? document.getElementById('bulkWarehouseVal').value
               : isTxt ? document.getElementById('bulkTextVal').value
               :          document.getElementById('bulkNumVal').value;
  if (rawVal === '' && !isWh) return;
  const val = isWh ? rawVal : (BULK_NUM_FIELDS.has(field) ? +rawVal : rawVal);

  rows.filter(r => selectedKeys.has(r._key)).forEach(r => {
    r[field] = val;
    r._dirty = true;
    // обновить input/select в DOM
    const tr = document.querySelector(`tr[data-key="${r._key}"]`);
    if (tr) {
      if (field === 'warehouse') {
        const sel = tr.querySelector('select[onchange*="warehouse"]');
        if (sel) sel.value = val;
      } else {
        const inp = tr.querySelector(`input[oninput*="'${field}'"]`);
        if (inp) inp.value = val;
      }
      updateComputedCells(r._key);
    }
    schedSave(r._key);
  });
}

// Инициализация bulk-warehouse select
function initBulkWarehouse() {
  const sel = document.getElementById('bulkWarehouseVal');
  sel.innerHTML = '<option value="">— склад —</option>' +
    WAREHOUSES.map(w => `<option value="${w}">${w}</option>`).join('');
}

// ─── Импорт из WB ────────────────────────────────────────────────────────────
async function openImport() {
  if (!currentProject) return;
  importArticles = [];
  document.getElementById('importTitle').textContent =
    `Артикулы из WB — ${currentProject} (30 дней)`;
  document.getElementById('importBody').innerHTML =
    '<div class="modal-loading">⏳ Загружаю данные из WB…</div>';
  document.getElementById('importSearch').value = '';
  document.getElementById('btnDoImport').disabled = true;
  document.getElementById('btnDoImport').textContent = 'Добавить 0 артикулов';
  document.getElementById('importOverlay').classList.add('open');

  try {
    const resp = await fetch('/api/unit-import-articles?project=' + encodeURIComponent(currentProject));
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    importArticles = data;
    renderImportList(importArticles);
  } catch (e) {
    document.getElementById('importBody').innerHTML =
      `<div class="modal-loading" style="color:var(--red)">❌ Ошибка: ${esc(e.message)}</div>`;
  }
}

function closeImport(e) {
  if (e && e.target !== document.getElementById('importOverlay')) return;
  document.getElementById('importOverlay').classList.remove('open');
}

// Набор уже существующих wb_article в текущем кабинете
function existingWbArticles() {
  return new Set(rows.map(r => String(r.wb_article)).filter(Boolean));
}

function renderImportList(articles, query = '') {
  const existing = existingWbArticles();
  // Показываем только новые (не в таблице)
  const newArticles = articles.filter(a => !existing.has(String(a.wb_article)));
  const q = query.toLowerCase();
  const filtered = newArticles.filter(a =>
    !q ||
    String(a.wb_article).includes(q) ||
    (a.seller_article || '').toLowerCase().includes(q) ||
    (a.name || '').toLowerCase().includes(q)
  );

  if (!newArticles.length) {
    document.getElementById('importBody').innerHTML =
      '<div class="modal-loading">✅ Нет новых артикулов — таблица актуальна</div>';
    updateImportBtn();
    return;
  }
  if (!filtered.length) {
    document.getElementById('importBody').innerHTML =
      '<div class="modal-loading">Ничего не найдено</div>';
    updateImportBtn();
    return;
  }

  document.getElementById('importBody').innerHTML = filtered.map(a =>
    `<label class="import-item">
      <input type="checkbox" data-id="${a.wb_article}" checked onchange="updateImportBtn()">
      <div class="import-item-info">
        <div class="import-item-name">${esc(a.seller_article || a.name || '—')}</div>
        <div class="import-item-meta">${a.wb_article}${a.brand ? ' · ' + esc(a.brand) : ''}</div>
      </div>
    </label>`
  ).join('');

  updateImportBtn();
}

function filterImport(q) {
  renderImportList(importArticles, q);
}

function toggleAll() {
  const boxes = document.querySelectorAll('#importBody input[type=checkbox]');
  const anyUnchecked = [...boxes].some(b => !b.checked);
  boxes.forEach(b => b.checked = anyUnchecked);
  document.querySelector('.modal-sel-all').textContent = anyUnchecked ? 'Снять все' : 'Выбрать все';
  updateImportBtn();
}

function updateImportBtn() {
  const count = document.querySelectorAll('#importBody input[type=checkbox]:checked').length;
  const btn = document.getElementById('btnDoImport');
  btn.disabled = count === 0;
  btn.textContent = `Добавить ${count} артикул${pluralRu(count)}`;
}

function pluralRu(n) {
  if (n % 10 === 1 && n % 100 !== 11) return '';
  if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return 'а';
  return 'ов';
}

async function doImport() {
  const checked = [...document.querySelectorAll('#importBody input[type=checkbox]:checked')];
  const ids = new Set(checked.map(b => String(b.dataset.id)));
  const toAdd = importArticles.filter(a => ids.has(String(a.wb_article)));

  document.getElementById('importOverlay').classList.remove('open');

  for (const a of toAdd) {
    addRow({
      wb_article:     a.wb_article,
      seller_article: a.seller_article || '',
      brand:          a.brand || currentProject,
    });
  }
}

// ─── Вспомогательные ─────────────────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleTheme(){
  const t = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = t;
  localStorage.setItem('theme', t);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const p = document.getElementById('filterPopup');
  if (p && p.classList.contains('open') && !p.contains(e.target)) closeFilter();
});

document.body.dataset.theme = localStorage.getItem('theme') || 'dark';
initBulkWarehouse();
onBulkFieldChange();
renderContent();
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Wblions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f13;--bg2:#1a1a24;--bg3:#22222f;--border:#252535;--text:#e8e8f0;--text2:#8080a8;--blue:#4a9eff;--green:#4ade80}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 30% 40%,rgba(74,158,255,.06) 0%,transparent 55%),radial-gradient(circle at 70% 70%,rgba(74,222,128,.04) 0%,transparent 50%);pointer-events:none}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:380px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.logo{font-size:42px;margin-bottom:6px}
.brand{font-size:22px;font-weight:700;margin-bottom:6px}
.brand em{color:var(--blue);font-style:normal}
.tagline{font-size:13px;color:var(--text2);margin-bottom:40px;line-height:1.5}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;color:#1f1f1f;border:none;padding:13px 20px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;transition:box-shadow .2s,transform .15s}
.google-btn:hover{box-shadow:0 4px 20px rgba(255,255,255,.15);transform:translateY(-1px)}
.google-btn:active{transform:translateY(0)}
.google-icon{width:20px;height:20px;flex-shrink:0}
.divider{margin:28px 0;display:flex;align-items:center;gap:12px;color:var(--text2);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.note{font-size:12px;color:var(--text2);line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🦁</div>
  <div class="brand"><em>Wblions</em></div>
  <div class="tagline">Дашборд задач и WB-отчётов.<br>Войдите через корпоративный Google-аккаунт.</div>

  <a class="google-btn" href="/auth/login">
    <svg class="google-icon" viewBox="0 0 48 48">
      <path fill="#4285F4" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.9 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-8.9 20-20 0-1.2-.1-2.3-.4-3.5z"/>
      <path fill="#34A853" d="M6.3 14.7l6.6 4.8C14.6 15.5 19 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/>
      <path fill="#FBBC05" d="M24 44c5.2 0 9.8-1.9 13.4-4.9l-6.2-5.1C29.2 35.5 26.7 36 24 36c-5.1 0-9.5-3-11.3-7.5l-6.6 5.1C9.6 39.5 16.3 44 24 44z"/>
      <path fill="#EA4335" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.4 4.3-4.5 5.6l6.2 5.1C39.9 36.2 44 30.6 44 24c0-1.2-.1-2.3-.4-3.5z"/>
    </svg>
    Войти через Google
  </a>

  <div class="divider">или</div>
  <div class="note">После первого входа администратор<br>настроит ваши права доступа.</div>
</div>
</body>
</html>
